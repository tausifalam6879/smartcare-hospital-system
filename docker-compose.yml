services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raahmediq}
      POSTGRES_USER: ${POSTGRES_USER:-raahmediq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-raahmediq}
      DB_USERNAME: ${POSTGRES_USER:-raahmediq}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RAAHMEDIQ_JWT_SECRET: ${RAAHMEDIQ_JWT_SECRET:?Set RAAHMEDIQ_JWT_SECRET in .env}
      RAAHMEDIQ_CORS_ORIGINS: ${RAAHMEDIQ_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RAAHMEDIQ_ONLINE_RESERVATION_TTL: ${RAAHMEDIQ_ONLINE_RESERVATION_TTL:-10m}
      RAAHMEDIQ_CASH_GRACE_PERIOD: ${RAAHMEDIQ_CASH_GRACE_PERIOD:-15m}
      RAAHMEDIQ_CANCELLATION_CUTOFF: ${RAAHMEDIQ_CANCELLATION_CUTOFF:-2h}
      RAAHMEDIQ_CHECK_IN_OPENS_BEFORE: ${RAAHMEDIQ_CHECK_IN_OPENS_BEFORE:-4h}
      RAAHMEDIQ_CHECK_IN_CLOSES_AFTER: ${RAAHMEDIQ_CHECK_IN_CLOSES_AFTER:-2h}
      RAAHMEDIQ_NOTIFICATION_CHANNELS: ${RAAHMEDIQ_NOTIFICATION_CHANNELS:-IN_APP}
      RAAHMEDIQ_DEMO_DATA: ${RAAHMEDIQ_DEMO_DATA:-false}
      RAAHMEDIQ_BLOOD_VERIFICATION_MAX_AGE: ${RAAHMEDIQ_BLOOD_VERIFICATION_MAX_AGE:-6h}
      RAAHMEDIQ_PAYMENT_PROVIDER: ${RAAHMEDIQ_PAYMENT_PROVIDER:-DEVELOPMENT}
      RAAHMEDIQ_PAYMENT_WEBHOOK_SECRET: ${RAAHMEDIQ_PAYMENT_WEBHOOK_SECRET:?Set RAAHMEDIQ_PAYMENT_WEBHOOK_SECRET in .env}
      RAAHMEDIQ_PAYMENT_INTENT_TTL: ${RAAHMEDIQ_PAYMENT_INTENT_TTL:-10m}
      RAAHMEDIQ_BOOTSTRAP_ADMIN: ${RAAHMEDIQ_BOOTSTRAP_ADMIN:-false}
      RAAHMEDIQ_ADMIN_MOBILE: ${RAAHMEDIQ_ADMIN_MOBILE:-}
      RAAHMEDIQ_ADMIN_EMAIL: ${RAAHMEDIQ_ADMIN_EMAIL:-}
      RAAHMEDIQ_ADMIN_PASSWORD: ${RAAHMEDIQ_ADMIN_PASSWORD:-}
      RAAHMEDIQ_ADMIN_NAME: ${RAAHMEDIQ_ADMIN_NAME:-RaahMediQ Health Administrator}
      RAAHMEDIQ_DOCUMENT_STORAGE_PATH: /var/lib/raahmediq/private-documents
      RAAHMEDIQ_AI_REQUESTS_PER_MINUTE: ${RAAHMEDIQ_AI_REQUESTS_PER_MINUTE:-12}
    volumes:
      - medical_documents:/var/lib/raahmediq/private-documents
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  medical_documents:
