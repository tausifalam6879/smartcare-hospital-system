services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcare}
      POSTGRES_USER: ${POSTGRES_USER:-smartcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartcare}
      DB_USERNAME: ${POSTGRES_USER:-smartcare}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SMARTCARE_JWT_SECRET: ${SMARTCARE_JWT_SECRET:?Set SMARTCARE_JWT_SECRET in .env}
      SMARTCARE_CORS_ORIGINS: ${SMARTCARE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SMARTCARE_ONLINE_RESERVATION_TTL: ${SMARTCARE_ONLINE_RESERVATION_TTL:-10m}
      SMARTCARE_CASH_GRACE_PERIOD: ${SMARTCARE_CASH_GRACE_PERIOD:-15m}
      SMARTCARE_CANCELLATION_CUTOFF: ${SMARTCARE_CANCELLATION_CUTOFF:-2h}
      SMARTCARE_CHECK_IN_OPENS_BEFORE: ${SMARTCARE_CHECK_IN_OPENS_BEFORE:-4h}
      SMARTCARE_CHECK_IN_CLOSES_AFTER: ${SMARTCARE_CHECK_IN_CLOSES_AFTER:-2h}
      SMARTCARE_NOTIFICATION_CHANNELS: ${SMARTCARE_NOTIFICATION_CHANNELS:-IN_APP}
      SMARTCARE_DEMO_DATA: ${SMARTCARE_DEMO_DATA:-false}
      SMARTCARE_BLOOD_VERIFICATION_MAX_AGE: ${SMARTCARE_BLOOD_VERIFICATION_MAX_AGE:-6h}
      SMARTCARE_PAYMENT_PROVIDER: ${SMARTCARE_PAYMENT_PROVIDER:-DEVELOPMENT}
      SMARTCARE_PAYMENT_WEBHOOK_SECRET: ${SMARTCARE_PAYMENT_WEBHOOK_SECRET:?Set SMARTCARE_PAYMENT_WEBHOOK_SECRET in .env}
      SMARTCARE_PAYMENT_INTENT_TTL: ${SMARTCARE_PAYMENT_INTENT_TTL:-10m}
      SMARTCARE_BOOTSTRAP_ADMIN: ${SMARTCARE_BOOTSTRAP_ADMIN:-false}
      SMARTCARE_ADMIN_MOBILE: ${SMARTCARE_ADMIN_MOBILE:-}
      SMARTCARE_ADMIN_EMAIL: ${SMARTCARE_ADMIN_EMAIL:-}
      SMARTCARE_ADMIN_PASSWORD: ${SMARTCARE_ADMIN_PASSWORD:-}
      SMARTCARE_ADMIN_NAME: ${SMARTCARE_ADMIN_NAME:-SmartCare Administrator}
      SMARTCARE_DOCUMENT_STORAGE_PATH: /var/lib/smartcare/private-documents
      SMARTCARE_AI_REQUESTS_PER_MINUTE: ${SMARTCARE_AI_REQUESTS_PER_MINUTE:-12}
    volumes:
      - medical_documents:/var/lib/smartcare/private-documents
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  medical_documents:
