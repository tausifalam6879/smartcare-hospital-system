steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloud
      - --build-arg
      - VITE_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _API_URL: https://smartcare-backend-807748718569.asia-south1.run.app
  _IMAGE: asia-south1-docker.pkg.dev/smartcare-staging-2026/smartcare/frontend:admin-setup
