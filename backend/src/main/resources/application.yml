server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: smartcare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcare}
    username: ${DB_USERNAME:smartcare}
    password: ${DB_PASSWORD:smartcare_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

smartcare:
  jwt:
    issuer: ${SMARTCARE_JWT_ISSUER:smartcare-local}
    secret: ${SMARTCARE_JWT_SECRET:dev-only-change-this-64-character-signing-secret-before-production-use}
    access-token-ttl: ${SMARTCARE_JWT_TTL:15m}
  cors:
    allowed-origins: ${SMARTCARE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin:
      enabled: ${SMARTCARE_BOOTSTRAP_ADMIN:false}
      mobile-number: ${SMARTCARE_ADMIN_MOBILE:}
      email: ${SMARTCARE_ADMIN_EMAIL:}
      password: ${SMARTCARE_ADMIN_PASSWORD:}
      display-name: ${SMARTCARE_ADMIN_NAME:SmartCare Administrator}
  demo-data:
    enabled: ${SMARTCARE_DEMO_DATA:false}
  queue:
    online-reservation-ttl: ${SMARTCARE_ONLINE_RESERVATION_TTL:10m}
    cash-grace-period: ${SMARTCARE_CASH_GRACE_PERIOD:15m}
    confirmed-cancellation-cutoff: ${SMARTCARE_CANCELLATION_CUTOFF:2h}
    no-show-grace-period: ${SMARTCARE_NO_SHOW_GRACE_PERIOD:15m}
  check-in:
    opens-before: ${SMARTCARE_CHECK_IN_OPENS_BEFORE:4h}
    closes-after: ${SMARTCARE_CHECK_IN_CLOSES_AFTER:2h}
  notifications:
    channels: ${SMARTCARE_NOTIFICATION_CHANNELS:IN_APP}
  payment:
    provider: ${SMARTCARE_PAYMENT_PROVIDER:DEVELOPMENT}
    webhook-secret: ${SMARTCARE_PAYMENT_WEBHOOK_SECRET:dev-only-payment-webhook-secret-change-before-production}
    intent-ttl: ${SMARTCARE_PAYMENT_INTENT_TTL:10m}
  documents:
    storage-path: ${SMARTCARE_DOCUMENT_STORAGE_PATH:./var/private-documents}
  ai:
    requests-per-minute: ${SMARTCARE_AI_REQUESTS_PER_MINUTE:12}
  blood-bank:
    verification-max-age: ${SMARTCARE_BLOOD_VERIFICATION_MAX_AGE:6h}
  blood-reaction-model:
    base-url: ${SMARTCARE_BLOOD_REACTION_MODEL_URL:http://127.0.0.1:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
