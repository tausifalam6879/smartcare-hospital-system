server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: raahmediq-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raahmediq}
    username: ${DB_USERNAME:raahmediq}
    password: ${DB_PASSWORD:raahmediq_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

raahmediq:
  jwt:
    issuer: ${RAAHMEDIQ_JWT_ISSUER:raahmediq-local}
    secret: ${RAAHMEDIQ_JWT_SECRET:dev-only-change-this-64-character-signing-secret-before-production-use}
    access-token-ttl: ${RAAHMEDIQ_JWT_TTL:15m}
  cors:
    allowed-origins: ${RAAHMEDIQ_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin:
      enabled: ${RAAHMEDIQ_BOOTSTRAP_ADMIN:false}
      mobile-number: ${RAAHMEDIQ_ADMIN_MOBILE:}
      email: ${RAAHMEDIQ_ADMIN_EMAIL:}
      password: ${RAAHMEDIQ_ADMIN_PASSWORD:}
      display-name: ${RAAHMEDIQ_ADMIN_NAME:RaahMediQ Health Administrator}
  demo-data:
    enabled: ${RAAHMEDIQ_DEMO_DATA:false}
  queue:
    online-reservation-ttl: ${RAAHMEDIQ_ONLINE_RESERVATION_TTL:10m}
    cash-grace-period: ${RAAHMEDIQ_CASH_GRACE_PERIOD:15m}
    confirmed-cancellation-cutoff: ${RAAHMEDIQ_CANCELLATION_CUTOFF:2h}
  check-in:
    opens-before: ${RAAHMEDIQ_CHECK_IN_OPENS_BEFORE:4h}
    closes-after: ${RAAHMEDIQ_CHECK_IN_CLOSES_AFTER:2h}
  notifications:
    channels: ${RAAHMEDIQ_NOTIFICATION_CHANNELS:IN_APP}
  payment:
    provider: ${RAAHMEDIQ_PAYMENT_PROVIDER:DEVELOPMENT}
    webhook-secret: ${RAAHMEDIQ_PAYMENT_WEBHOOK_SECRET:dev-only-payment-webhook-secret-change-before-production}
    intent-ttl: ${RAAHMEDIQ_PAYMENT_INTENT_TTL:10m}
  documents:
    storage-path: ${RAAHMEDIQ_DOCUMENT_STORAGE_PATH:./var/private-documents}
  ai:
    requests-per-minute: ${RAAHMEDIQ_AI_REQUESTS_PER_MINUTE:12}
  blood-bank:
    verification-max-age: ${RAAHMEDIQ_BLOOD_VERIFICATION_MAX_AGE:6h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
